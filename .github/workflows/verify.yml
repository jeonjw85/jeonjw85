name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check fonttools pytest

      - name: Run generator tests
        run: python -m pytest scripts/badge -q

      # The strip embeds live metrics, so a bare `--check` would fail whenever
      # a number legitimately changed. Instead assert the committed file is a
      # well-formed strip whose baked-in values still parse.
      - name: Validate committed badge
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.badge import sources

          header = Path("badges/header.svg").read_text()

          assert header.startswith("<svg"), "header: not an SVG"
          assert header.rstrip().endswith("</svg>"), "header: truncated"
          assert 'role="img"' in header, "header: missing role"
          assert 'aria-label="' in header, "header: missing aria-label"

          previous = sources.read_previous(header)
          required = {"kenfold_stars", "aij_month", "npm_total", "rapid_photo_web_pulls"}
          missing = required - previous.keys()
          assert not missing, f"unreadable metrics: {missing}"
          assert 'width="450"' in header, "strip must stay 450px wide"
          assert "stroke" not in header, "strip must not draw an outline"
          print("badge OK:", previous)
          PY
